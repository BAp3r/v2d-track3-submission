[project]
name = "v2d-ego-environment"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "v2d-common",
    "v2d-docker",
    "v2d-depth",
    "v2d-anycalib-docker",
    "v2d-geocalib-docker",
    "v2d-droid-slam-docker",
    "v2d-ego-hand-reconstruction-docker",
    "v2d-foundation-pose-docker",
    "v2d-grounding-dino-docker",
    "v2d-gsplat-refinement-docker",
    "v2d-hamer-docker",
    "v2d-hand-alignment-docker",
    "v2d-hawor-docker",
    "v2d-mediapipe-docker",
    "v2d-moge-docker",
    "v2d-sam2-docker",
    "v2d-sam3d-docker",
    "v2d-wilor-docker",
    "v2d-ace-hand-docker",
    "v2d-pipelines",
    "Pillow",
    "scipy>=1.13,<2",
]

[tool.uv.sources]
v2d-common = { path = "../../modules/v2d_common", editable = true }
